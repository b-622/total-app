<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資材数量入力</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: Arial, "Noto Sans JP", sans-serif;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px;
    }

    .total-box {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-align: center;
    }

    .total-label {
      font-size: 16px;
      color: #666;
      margin-bottom: 3px;
    }

    #total {
      font-size: 36px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .column {
      background: white;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .column-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 10px 4px;
      margin-bottom: 8px;
      background: #e5e7eb;
      border-radius: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
    }

    .item-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item input {
      width: 65px;
      height: 38px;
      padding: 4px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 7px;
      text-align: right;
    }

    .item input:focus {
      outline: none;
      border: 2px solid #4285f4;
    }

    .spacer {
      height: 18px;
    }

    .button-area {
      margin-top: 12px;
      text-align: center;
    }

    button {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 8px;
      background: #555;
      color: white;
      font-size: 16px;
    }

    button:active {
      background: #333;
    }

    @media (max-width: 700px) {
      .container {
        padding: 6px;
      }

      .grid {
        gap: 5px;
      }

      .column {
        padding: 4px;
      }

      .column-title {
        font-size: 15px;
        padding: 8px 2px;
      }

      .item {
        gap: 2px;
        margin-bottom: 5px;
      }

      .item-name {
        font-size: 11px;
      }

      .item input {
        width: 45px;
        height: 34px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="total-box">
    <div class="total-label">合計</div>
    <div id="total">0</div>
  </div>

  <div class="grid">

    <!-- パイプ -->
    <div class="column">
      <div class="column-title">パイプ</div>

      <div class="item"><span class="item-name">6M</span><input type="number"></div>
      <div class="item"><span class="item-name">5M</span><input type="number"></div>
      <div class="item"><span class="item-name">4M</span><input type="number"></div>
      <div class="item"><span class="item-name">3M</span><input type="number"></div>
      <div class="item"><span class="item-name">2.5M</span><input type="number"></div>
      <div class="item"><span class="item-name">2M</span><input type="number"></div>
      <div class="item"><span class="item-name">1.5M</span><input type="number"></div>
      <div class="item"><span class="item-name">1M</span><input type="number"></div>

      <div class="spacer"></div>

      <div class="item"><span class="item-name">4.5M</span><input type="number"></div>
      <div class="item"><span class="item-name">3.5M</span><input type="number"></div>
    </div>

    <!-- 板 -->
    <div class="column">
      <div class="column-title">板</div>

      <div class="item"><span class="item-name">4M</span><input type="number"></div>
      <div class="item"><span class="item-name">3M</span><input type="number"></div>
      <div class="item"><span class="item-name">2M</span><input type="number"></div>
      <div class="item"><span class="item-name">1.5M</span><input type="number"></div>
      <div class="item"><span class="item-name">1M</span><input type="number"></div>
      <div class="item"><span class="item-name">アミ</span><input type="number"></div>

      <div class="spacer"></div>

      <div class="item"><span class="item-name">杉板4M</span><input type="number"></div>
      <div class="item"><span class="item-name">杉板2M</span><input type="number"></div>
    </div>

    <!-- 小物 -->
    <div class="column">
      <div class="column-title">小物</div>

      <div class="item"><span class="item-name">直交</span><input type="number"></div>
      <div class="item"><span class="item-name">自在</span><input type="number"></div>
      <div class="item"><span class="item-name">鉄骨</span><input type="number"></div>
      <div class="item"><span class="item-name">ジョイント</span><input type="number"></div>
      <div class="item"><span class="item-name">ベース</span><input type="number"></div>
      <div class="item"><span class="item-name">敷板</span><input type="number"></div>
      <div class="item"><span class="item-name">入口チェーン</span><input type="number"></div>
      <div class="item"><span class="item-name">吊クランプ</span><input type="number"></div>
      <div class="item"><span class="item-name">ブラケット</span><input type="number"></div>
      <div class="item"><span class="item-name">チェーン4M</span><input type="number"></div>
      <div class="item"><span class="item-name">チェーン3M</span><input type="number"></div>
      <div class="item"><span class="item-name">ハシゴ4M</span><input type="number"></div>
      <div class="item"><span class="item-name">ハシゴ3M</span><input type="number"></div>
    </div>

    <!-- ビデ -->
    <div class="column">
      <div class="column-title">ビデ</div>

      <div class="item"><span class="item-name">建枠 1200</span><input type="number"></div>
      <div class="item"><span class="item-name">建枠 900</span><input type="number"></div>
      <div class="item"><span class="item-name">建枠 600</span><input type="number"></div>
      <div class="item"><span class="item-name">筋交 1800</span><input type="number"></div>
      <div class="item"><span class="item-name">筋交 1200</span><input type="number"></div>
      <div class="item"><span class="item-name">筋交 600</span><input type="number"></div>
      <div class="item"><span class="item-name">下桟 1800</span><input type="number"></div>
      <div class="item"><span class="item-name">下桟 1200</span><input type="number"></div>
      <div class="item"><span class="item-name">下桟 600</span><input type="number"></div>
      <div class="item"><span class="item-name">鉄製板 正規</span><input type="number"></div>
      <div class="item"><span class="item-name">鉄製板 ハーフ</span><input type="number"></div>
      <div class="item"><span class="item-name">鉄製板 900</span><input type="number"></div>
      <div class="item"><span class="item-name">カイダン</span><input type="number"></div>
      <div class="item"><span class="item-name">カイダン手摺</span><input type="number"></div>
      <div class="item"><span class="item-name">ｴﾝﾄﾞｽﾄｯﾊﾟｰ</span><input type="number"></div>
      <div class="item"><span class="item-name">ジャッキ</span><input type="number"></div>
      <div class="item"><span class="item-name">ロングジャッキ</span><input type="number"></div>
      <div class="item"><span class="item-name">ジャッキ自在</span><input type="number"></div>
      <div class="item"><span class="item-name">セーフティガード</span><input type="number"></div>
    </div>

  </div>

  <div class="button-area">
    <button onclick="clearAll()">入力を全部クリア</button>
  </div>

</div>

<script>
  const inputs = document.querySelectorAll("input");
  const total = document.getElementById("total");

  function calculate() {
    let sum = 0;

    inputs.forEach(input => {
      const value = parseFloat(input.value);

      if (!isNaN(value)) {
        sum += value;
      }
    });

    total.textContent = sum.toLocaleString();
  }

  function saveData() {
    const data = [];

    inputs.forEach(input => {
      data.push(input.value);
    });

    localStorage.setItem("totalAppData", JSON.stringify(data));
  }

  function loadData() {
    const saved = localStorage.getItem("totalAppData");

    if (saved) {
      const data = JSON.parse(saved);

      inputs.forEach((input, index) => {
        if (data[index] !== undefined) {
          input.value = data[index];
        }
      });
    }

    calculate();
  }

  inputs.forEach(input => {
    input.addEventListener("input", () => {
      calculate();
      saveData();
    });
  });

  function clearAll() {
    if (confirm("すべての入力を消しますか？")) {
      inputs.forEach(input => {
        input.value = "";
      });

      localStorage.removeItem("totalAppData");
      calculate();
    }
  }

  loadData();
</script>

</body>
</html>
